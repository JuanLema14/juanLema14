name: Update GitHub Stats

on:
  schedule:
    # Ejecutar todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutar manualmente
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN_GIT }}
          user: JuanLema14
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Bogota
          
          # Plugins
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_from: 200
          
          # Configuración
          repositories: 100
          repositories_batch: 100
          repositories_affiliations: owner, collaborator, organization_member
          
          # Salida
          filename: metrics.svg
          
          # Incluir repos privados
          use_prebuilt_image: yes
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update GitHub metrics" && git push)